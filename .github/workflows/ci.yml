name: CI

on:
  push:
    branches: [main]   # branches are covered via pull_request; main also drives deploy
  pull_request:

# Cancel superseded runs on the same ref (fixes duplicate push+PR runs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Single version: libsql-experimental only ships a wheel for 3.12 (see .python-version).
    # This is matrix-ready — add versions here once the dep supports them.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      SECRET_KEY: ci-secret
      APP_PASSWORD: ci-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + property + integration tests
        run: |
          python test_money.py
          python test_app.py

  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (typed modules — money/config/auth)
        run: mypy

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt pip-audit==2.7.3
      - name: Dependency CVE audit (pip-audit)
        run: pip-audit --desc
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-fuzz:
    name: API fuzzing (schemathesis, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: surfaces unvalidated-input / contract gaps, never blocks
    env:
      SECRET_KEY: ci-secret
      APP_PASSWORD: ci-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt "schemathesis<4"
      - name: Boot app
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/me >/dev/null && break; sleep 1; done
      - name: Fuzz the OpenAPI schema (authenticated)
        # Advisory: findings (e.g. 500s on malformed input, since endpoints parse raw
        # dicts rather than Pydantic models) are printed to the log but never block.
        run: |
          COOKIE="session=$(python -c "import hmac,hashlib;print(hmac.new(b'ci-secret',b'ok',hashlib.sha256).hexdigest())")"
          schemathesis run http://127.0.0.1:8000/openapi.json \
            --checks all --hypothesis-max-examples=25 -H "Cookie: $COOKIE" \
            || echo "::warning::schemathesis reported advisory findings — see log above."

  turso-smoke:
    name: Turso smoke (opt-in)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      APP_PASSWORD: ci-pass
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Boot against Turso if secrets set (point them at a TEST db)
        run: |
          if [ -n "$TURSO_DATABASE_URL" ]; then
            python scripts/turso_smoke.py
          else
            echo "TURSO_DATABASE_URL not set — skipping Turso smoke."
          fi

  deploy:
    name: Render deploy
    needs: [test, quality, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK" >/dev/null && echo "Render deploy hook triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set. Render auto-deploys main via its GitHub"
            echo "integration, so no explicit trigger is needed."
          fi
