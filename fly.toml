# Fly.io config. Edit `app` to a unique name, then:
#   fly launch --no-deploy       (or: fly apps create <name>)
#   fly volumes create data --size 1
#   fly secrets set APP_PASSWORD=yourpassword SECRET_KEY=$(openssl rand -hex 32)
#   fly deploy
app = "couple-finance-changeme"
primary_region = "sin"          # Singapore — closest to India

[build]

[env]
  DB_PATH = "/data/couple_finance.db"

[[mounts]]
  source = "data"               # the volume created above; keeps SQLite across deploys
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0       # scales to zero when idle (free-friendly)
